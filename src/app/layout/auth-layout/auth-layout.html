      src="/Illustration%20Container.svg"
      alt=""
      aria-hidden="true"
    />
    <div class="auth-layout__illustration-copy">
      <h2>
        Welcome to<br />
        Dreams<span class="auth-layout__accent">LMS</span> Courses.
