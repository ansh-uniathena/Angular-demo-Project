<h1 class="auth-page__heading">Forgot Password?</h1>
<p class="auth-page__subtext">Enter your email to reset your password.</p>

<app-alert [message]="errorMessage()" />

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <app-form-field label="Email" type="email" icon="mail" [required]="true" formControlName="email" />
  <app-button type="submit" [loading]="submitting()">Submit</app-button>
</form>

<p class="auth-page__footer">
  Remember Password? <a class="auth-page__link" routerLink="/auth/login">Sign In</a>
</p>
