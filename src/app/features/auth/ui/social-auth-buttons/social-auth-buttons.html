<div class="social-auth">
  <div class="social-auth__divider" role="separator">
    <span>Or</span>
  </div>
  <div class="social-auth__row">
    <button type="button" class="social-auth__btn" (click)="google.emit()">
      <img src="/Google.png" alt="" aria-hidden="true" />
      Google
    </button>
    <button type="button" class="social-auth__btn" (click)="facebook.emit()">
      <img src="/Facebook.png" alt="" aria-hidden="true" />
      Facebook
    </button>
  </div>
</div>
