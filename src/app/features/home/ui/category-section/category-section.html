<section class="category-section">
  <div class="category-section__inner">
    <app-section-heading
      eyebrow="Favourite Course"
      title="Top Category"
      ctaLabel="View all Categories"
      ctaLink="/courses"
    />
    <div class="category-section__grid">
      @for (category of categories(); track category.id) {
        <a routerLink="/courses" class="category-card">
          <span class="category-card__icon-ring">
            <img [src]="category.iconUrl" [alt]="category.name" />
          </span>
          <h3>{{ category.name }}</h3>
          <p>{{ category.instructorCount }} Instructors</p>
        </a>
      }
    </div>
  </div>
</section>
