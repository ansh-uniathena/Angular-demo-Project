<section class="trusted-by">
  <div class="trusted-by__inner">
    <p class="trusted-by__eyebrow">Trusted By</p>
    <h2>500+ Leading Universities And Companies</h2>
    <div class="trusted-by__logos">
      <img src="/Jira Logo.png" alt="Jira Software" class="trusted-by__logo-img" />
      @for (brand of wordmarkBrands; track brand) {
        <span class="trusted-by__wordmark">{{ brand }}</span>
      }
    </div>
  </div>
</section>
